<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedixPulse-BD-1 | Authentication & User Management</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-indigo-600 text-white py-4 shadow-md">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">MedixPulse-BD-1 Portal</h1>
            <a href="index.html" class="text-sm bg-indigo-500 hover:bg-indigo-700 px-3 py-1.5 rounded-lg transition">Back to Marketplace</a>
        </div>
    </header>

    <!-- Auth Container -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
            
            <div class="text-center mb-6">
                <h2 id="form-title" class="text-2xl font-bold text-indigo-700">Welcome Back</h2>
                <p id="form-subtitle" class="text-sm text-slate-500 mt-1">Sign in to your MedixPulse account</p>
            </div>

            <!-- Alerts -->
            <div id="auth-error" class="hidden mb-4 p-3 bg-red-100 text-red-700 text-sm rounded-lg"></div>
            <div id="auth-success" class="hidden mb-4 p-3 bg-emerald-100 text-emerald-700 text-sm rounded-lg"></div>

            <!-- Auth Form -->
            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                    <input type="email" id="email" required placeholder="user@example.com" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>

                <div id="role-container" class="hidden">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Select Role</label>
                    <select id="user-role" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-white">
                        <option value="customer">Customer / Patient</option>
                        <option value="vendor">Vendor / Pharmacy Owner</option>
                        <option value="doctor">Doctor / Specialist</option>
                    </select>
                </div>

                <button type="submit" id="auth-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition text-sm shadow-md">
                    Sign In
                </button>
            </form>

            <!-- Toggle between Login and Signup -->
            <div class="mt-6 text-center text-sm text-slate-600">
                <p id="toggle-text">Don't have an account? <button id="toggle-btn" class="text-indigo-600 font-semibold hover:underline">Sign Up</button></p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        &copy; 2026 MedixPulse-BD-1. Enterprise Healthcare Ecosystem.
    </footer>

    <!-- Auth Script Logic -->
    <script>
        const SUPABASE_URL = 'https://cirdudmahqtqlfsadmgx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpcmR1ZG1haHF0cWxmc2FkbWd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNTI0MTcsImV4cCI6MjEwNjkyODQxN30.J4UymGx76kX8MwVa5re5TwLkSbIopzdV4_jYe9MXr7Q';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isSignUp = false;

        const formTitle = document.getElementById('form-title');
        const formSubtitle = document.getElementById('form-subtitle');
        const authForm = document.getElementById('auth-form');
        const authBtn = document.getElementById('auth-btn');
        const toggleBtn = document.getElementById('toggle-btn');
        const toggleText = document.getElementById('toggle-text');
        const roleContainer = document.getElementById('role-container');
        const errorBanner = document.getElementById('auth-error');
        const successBanner = document.getElementById('auth-success');

        function showError(msg) {
            errorBanner.textContent = msg;
            errorBanner.classList.remove('hidden');
            successBanner.classList.add('hidden');
        }

        function showSuccess(msg) {
            successBanner.textContent = msg;
            successBanner.classList.remove('hidden');
            errorBanner.classList.add('hidden');
        }

        // Toggle Login / Signup Mode
        toggleBtn.addEventListener('click', () => {
            isSignUp = !isSignUp;
            if (isSignUp) {
                formTitle.textContent = 'Create Account';
                formSubtitle.textContent = 'Register a new MedixPulse account';
                authBtn.textContent = 'Sign Up';
                toggleText.innerHTML = `Already have an account? <button type="button" id="toggle-btn" class="text-indigo-600 font-semibold hover:underline">Sign In</button>`;
                roleContainer.classList.remove('hidden');
            } else {
                formTitle.textContent = 'Welcome Back';
                formSubtitle.textContent = 'Sign in to your MedixPulse account';
                authBtn.textContent = 'Sign In';
                toggleText.innerHTML = `Don't have an account? <button type="button" id="toggle-btn" class="text-indigo-600 font-semibold hover:underline">Sign Up</button>`;
                roleContainer.classList.add('hidden');
            }
            // Re-bind listener to dynamic toggle button
            document.getElementById('toggle-btn').addEventListener('click', arguments.callee);
        });

        // Handle Form Submit (Login or Signup)
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const role = document.getElementById('user-role').value;

            errorBanner.classList.add('hidden');
            successBanner.classList.add('hidden');
            authBtn.disabled = true;
            authBtn.textContent = isSignUp ? 'Creating Account...' : 'Signing In...';

            try {
                if (isSignUp) {
                    const { data, error } = await _supabase.auth.signUp({
                        email,
                        password,
                        options: {
                            data: { role: role }
                        }
                    });
                    if (error) throw error;
                    showSuccess('Registration successful! Please check your email for confirmation.');
                } else {
                    const { data, error } = await _supabase.auth.signInWithPassword({
                        email,
                        password
                    });
                    if (error) throw error;
                    showSuccess('Login successful! Redirecting...');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                }
            } catch (err) {
                showError(err.message);
            } finally {
                authBtn.disabled = false;
                authBtn.textContent = isSignUp ? 'Sign Up' : 'Sign In';
            }
        });
    </script>
</body>
</html>
