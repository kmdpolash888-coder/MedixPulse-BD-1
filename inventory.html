<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedixPulse-BD-1 | Product Inventory & Catalog</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- External Supabase Client File -->
    <script src="supabaseClient.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-indigo-600 text-white py-4 shadow-md">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">MedixPulse-BD-1 | Inventory & Catalog</h1>
            <div class="flex items-center gap-3">
                <a href="owner-panel.html" class="text-sm bg-indigo-500 hover:bg-indigo-700 px-3 py-1.5 rounded-lg transition">Owner Panel</a>
                <a href="auth.html" class="text-sm bg-white text-indigo-600 font-semibold px-3 py-1.5 rounded-lg shadow-sm hover:bg-slate-100 transition">Account</a>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Product Upload Form (Left Column) -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 lg:col-span-1 space-y-4">
            <div class="border-b pb-3">
                <h2 class="text-xl font-bold text-indigo-700">Add New Product</h2>
                <p class="text-xs text-slate-500 mt-0.5">List products to the global healthcare catalog.</p>
            </div>

            <!-- Alerts -->
            <div id="product-error" class="hidden p-3 bg-red-100 text-red-700 text-xs rounded-lg"></div>
            <div id="product-success" class="hidden p-3 bg-emerald-100 text-emerald-700 text-xs rounded-lg"></div>

            <form id="inventory-form" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Vendor UUID</label>
                    <input type="text" id="form-vendor-uuid" readonly class="w-full px-3 py-2 text-xs border border-slate-300 bg-slate-100 rounded-lg font-mono text-slate-600">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Product Name</label>
                    <input type="text" id="product-name" required placeholder="e.g. Napa Extra 500mg" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Price ($)</label>
                        <input type="number" step="0.01" id="product-price" required placeholder="0.00" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Stock Quantity</label>
                        <input type="number" id="product-stock" required placeholder="100" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Description</label>
                    <textarea id="product-desc" rows="2" placeholder="Product details & dosage..." class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Product Image</label>
                    <input type="file" id="product-image" accept="image/*" required class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                </div>

                <button type="submit" id="upload-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition text-xs shadow-md">
                    Upload to Catalog
                </button>
            </form>
        </section>

        <!-- Live Product Catalog Grid (Right Column) -->
        <section class="lg:col-span-2 space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold text-slate-800">Live Marketplace Catalog</h2>
                <button onclick="loadCatalog()" class="text-xs bg-slate-200 hover:bg-slate-300 px-3 py-1.5 rounded-lg transition font-medium">Refresh Catalog</button>
            </div>
            
            <div id="catalog-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <p class="text-slate-500 text-sm italic col-span-2">Loading inventory catalog...</p>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        &copy; 2026 MedixPulse-BD-1. Enterprise Healthcare Ecosystem.
    </footer>

    <!-- Inventory & Catalog Logic -->
    <script>
        const errorBanner = document.getElementById('product-error');
        const successBanner = document.getElementById('product-success');
        const inventoryForm = document.getElementById('inventory-form');
        const uploadBtn = document.getElementById('upload-btn');
        const catalogGrid = document.getElementById('catalog-grid');
        const vendorUuidInput = document.getElementById('form-vendor-uuid');

        // Load Vendor UUID from LocalStorage
        let vendorUuid = localStorage.getItem('medix_vendor_uuid');
        if (!vendorUuid) {
            vendorUuid = 'v-' + Math.random().toString(36).substring(2, 12);
            localStorage.setItem('medix_vendor_uuid', vendorUuid);
        }
        vendorUuidInput.value = vendorUuid;

        function showError(msg) {
            errorBanner.textContent = msg;
            errorBanner.classList.remove('hidden');
            successBanner.classList.add('hidden');
        }

        function showSuccess(msg) {
            successBanner.textContent = msg;
            successBanner.classList.remove('hidden');
            errorBanner.classList.add('hidden');
        }

        // Fetch & Render Live Catalog
        async function loadCatalog() {
            try {
                if (!window._supabase) {
                    catalogGrid.innerHTML = '<p class="text-red-500 text-xs col-span-2">Supabase client not initialized.</p>';
                    return;
                }

                const { data, error } = await window._supabase
                    .from('products')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    catalogGrid.innerHTML = '<p class="text-slate-500 text-xs col-span-2">No products found in the catalog.</p>';
                    return;
                }

                catalogGrid.innerHTML = data.map(item => `
                    <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm flex flex-col justify-between">
                        <div class="h-36 bg-slate-100 overflow-hidden">
                            <img src="${item.image_url || 'https://via.placeholder.com/300'}" alt="${item.name}" class="w-full h-full object-cover">
                        </div>
                        <div class="p-3 flex flex-col flex-grow">
                            <h3 class="font-bold text-sm text-slate-800">${item.name}</h3>
                            <p class="text-indigo-600 font-semibold text-xs mb-1">$${Number(item.price).toFixed(2)}</p>
                            <p class="text-slate-600 text-xs mb-3 flex-grow">${item.description || 'No description.'}</p>
                            <div class="border-t pt-2 text-[11px] text-slate-500 flex justify-between">
                                <span>Stock: <strong>${item.stock}</strong></span>
                                <span>Vendor: ${item.vendor_uuid ? item.vendor_uuid.substring(0, 6) + '...' : 'N/A'}</span>
                            </div>
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                console.error(err);
                catalogGrid.innerHTML = `<p class="text-red-500 text-xs col-span-2">Error loading catalog: ${err.message}</p>`;
            }
        }

        // Handle Product Upload & Image Storage
        inventoryForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            uploadBtn.disabled = true;
            uploadBtn.textContent = 'Uploading Image & Data...';
            errorBanner.classList.add('hidden');
            successBanner.classList.add('hidden');

            try {
                const name = document.getElementById('product-name').value.trim();
                const price = parseFloat(document.getElementById('product-price').value);
                const stock = parseInt(document.getElementById('product-stock').value);
                const description = document.getElementById('product-desc').value.trim();
                const imageFile = document.getElementById('product-image').files[0];

                let imageUrl = '';

                if (imageFile && window._supabase) {
                    const fileExt = imageFile.name.split('.').pop();
                    const fileName = `prod-${Date.now()}-${Math.random().toString(36).substring(2)}.${fileExt}`;
                    
                    const { error: uploadError } = await window._supabase.storage
                        .from('product-images')
                        .upload(fileName, imageFile);

                    if (uploadError) throw uploadError;

                    const { data: publicUrlData } = window._supabase.storage
                        .from('product-images')
                        .getPublicUrl(fileName);

                    imageUrl = publicUrlData.publicUrl;
                }

                if (window._supabase) {
                    const { error: dbError } = await window._supabase
                        .from('products')
                        .insert([{
                            vendor_uuid: vendorUuid,
                            name,
                            price,
                            stock,
                            description,
                            image_url: imageUrl
                        }]);

                    if (dbError) throw dbError;
                }

                showSuccess('Product successfully uploaded to inventory!');
                inventoryForm.reset();
                vendorUuidInput.value = vendorUuid;
                loadCatalog();

            } catch (err) {
                showError('Upload failed: ' + err.message);
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.textContent = 'Upload to Catalog';
            }
        });

        // Initial Load
        loadCatalog();
    </script>
</body>
</html>
