<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedixPulse-BD-1 | Shopping Cart & Checkout</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- External Supabase Client File -->
    <script src="supabaseClient.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-indigo-600 text-white py-4 shadow-md">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">MedixPulse-BD-1 | Secure Checkout</h1>
            <div class="flex items-center gap-3">
                <a href="inventory.html" class="text-sm bg-indigo-500 hover:bg-indigo-700 px-3 py-1.5 rounded-lg transition">Catalog</a>
                <a href="index.html" class="text-sm bg-white text-indigo-600 font-semibold px-3 py-1.5 rounded-lg shadow-sm hover:bg-slate-100 transition">Home</a>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Cart Items List (Left 2 Columns) -->
        <section class="lg:col-span-2 space-y-4">
            <h2 class="text-xl font-bold text-slate-800">Shopping Cart Items</h2>
            <div id="cart-items-container" class="space-y-3">
                <!-- Dynamic Cart Items will load here -->
                <p class="text-slate-500 text-sm italic">Your shopping cart is currently empty.</p>
            </div>
        </section>

        <!-- Checkout & Order Summary (Right Column) -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4 h-fit">
            <h2 class="text-xl font-bold text-indigo-700">Order Summary</h2>
            
            <div id="checkout-alert" class="hidden p-3 bg-emerald-100 text-emerald-700 text-xs rounded-lg"></div>

            <div class="space-y-2 text-sm border-b pb-4">
                <div class="flex justify-between text-slate-600">
                    <span>Subtotal</span>
                    <span id="summary-subtotal" class="font-semibold">$0.00</span>
                </div>
                <div class="flex justify-between text-slate-600">
                    <span>Shipping Fee</span>
                    <span id="summary-shipping" class="font-semibold">$5.00</span>
                </div>
                <div class="flex justify-between text-slate-800 text-base font-bold pt-2 border-t">
                    <span>Total Amount</span>
                    <span id="summary-total" class="text-indigo-600">$5.00</span>
                </div>
            </div>

            <!-- Customer Shipping Info Form -->
            <form id="checkout-form" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Receiver Name</label>
                    <input type="text" id="cust-name" required placeholder="Full Name" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Phone Number</label>
                    <input type="text" id="cust-phone" required placeholder="+880 1700..." class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Delivery Address</label>
                    <textarea id="cust-address" rows="2" required placeholder="House, Road, City..." class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Payment Method</label>
                    <select id="payment-method" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg bg-white">
                        <option value="cod">Cash on Delivery (COD)</option>
                        <option value="bkash">bKash / Mobile Banking</option>
                        <option value="card">Credit / Debit Card</option>
                    </select>
                </div>

                <button type="submit" id="checkout-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition text-xs shadow-md">
                    Confirm & Place Order
                </button>
            </form>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        &copy; 2026 MedixPulse-BD-1. Enterprise Healthcare Ecosystem.
    </footer>

    <!-- Cart & Checkout Script Logic -->
    <script>
        const cartContainer = document.getElementById('cart-items-container');
        const subtotalEl = document.getElementById('summary-subtotal');
        const shippingEl = document.getElementById('summary-shipping');
        const totalEl = document.getElementById('summary-total');
        const checkoutForm = document.getElementById('checkout-form');
        const checkoutAlert = document.getElementById('checkout-alert');
        const checkoutBtn = document.getElementById('checkout-btn');

        // Mock Cart State (Can be synchronized with localStorage)
        let cart = JSON.parse(localStorage.getItem('medix_cart')) || [
            { id: '1', name: 'Digital Blood Pressure Monitor', price: 45.00, quantity: 1, image_url: 'https://via.placeholder.com/150' },
            { id: '2', name: 'Napa Extra 500mg (Strip)', price: 1.50, quantity: 2, image_url: 'https://via.placeholder.com/150' }
        ];

        function saveCart() {
            localStorage.setItem('medix_cart', JSON.stringify(cart));
            renderCart();
        }

        function renderCart() {
            if (!cart || cart.length === 0) {
                cartContainer.innerHTML = '<p class="text-slate-500 text-sm italic">Your shopping cart is currently empty.</p>';
                subtotalEl.textContent = '$0.00';
                totalEl.textContent = '$5.00';
                return;
            }

            let subtotal = 0;
            cartContainer.innerHTML = cart.map((item, index) => {
                subtotal += item.price * item.quantity;
                return `
                    <div class="bg-white border border-slate-200 p-4 rounded-xl flex items-center gap-4 shadow-sm">
                        <img src="${item.image_url}" alt="${item.name}" class="w-16 h-16 object-cover rounded-lg bg-slate-100">
                        <div class="flex-grow">
                            <h3 class="font-bold text-sm text-slate-800">${item.name}</h3>
                            <p class="text-indigo-600 font-semibold text-xs">$${item.price.toFixed(2)}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="updateQty(${index}, -1)" class="px-2 py-1 bg-slate-100 rounded text-xs font-bold hover:bg-slate-200">-</button>
                            <span class="text-xs font-semibold px-2">${item.quantity}</span>
                            <button onclick="updateQty(${index}, 1)" class="px-2 py-1 bg-slate-100 rounded text-xs font-bold hover:bg-slate-200">+</button>
                        </div>
                        <button onclick="removeItem(${index})" class="text-red-500 hover:text-red-700 text-xs font-medium ml-4">Remove</button>
                    </div>
                `;
            }).join('');

            const shipping = 5.00;
            subtotalEl.textContent = `$${subtotal.toFixed(2)}`;
            shippingEl.textContent = `$${shipping.toFixed(2)}`;
            totalEl.textContent = `$${(subtotal + shipping).toFixed(2)}`;
        }

        window.updateQty = function(index, change) {
            cart[index].quantity += change;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            saveCart();
        };

        window.removeItem = function(index) {
            cart.splice(index, 1);
            saveCart();
        };

        checkoutForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!cart || cart.length === 0) {
                alert('Your cart is empty!');
                return;
            }

            checkoutBtn.disabled = true;
            checkoutBtn.textContent = 'Processing Order...';

            try {
                const name = document.getElementById('cust-name').value.trim();
                const phone = document.getElementById('cust-phone').value.trim();
                const address = document.getElementById('cust-address').value.trim();
                const paymentMethod = document.getElementById('payment-method').value;

                // Sync order with Supabase 'orders' table if available
                if (window._supabase) {
                    const { error } = await window._supabase
                        .from('orders')
                        .insert([{
                            customer_name: name,
                            phone: phone,
                            address: address,
                            payment_method: paymentMethod,
                            items: cart,
                            status: 'Pending'
                        }]);

                    if (error) console.warn('Order sync warning:', error.message);
                }

                checkoutAlert.textContent = 'Order placed successfully! Thank you for choosing MedixPulse.';
                checkoutAlert.classList.remove('hidden');
                localStorage.removeItem('medix_cart');
                cart = [];
                renderCart();
                checkoutForm.reset();

            } catch (err) {
                alert('Checkout error: ' + err.message);
            } finally {
                checkoutBtn.disabled = false;
                checkoutBtn.textContent = 'Confirm & Place Order';
            }
        });

        renderCart();
    </script>
</body>
</html>
