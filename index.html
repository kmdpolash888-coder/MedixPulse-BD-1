<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natural Care BD</title>
    <style>
        :root {
            --primary-green: #2e7d32;
            --accent-pink: #d81b60;
            --bg-light: #f4f6f5;
            --text-dark: #333333;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            padding-bottom: 60px;
        }
        /* Header */
        header {
            background: linear-gradient(135deg, var(--primary-green), var(--accent-pink));
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo-area {
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .menu-icon {
            font-size: 24px;
            cursor: pointer;
        }

        /* Banner/Slider */
        .banner {
            width: 100%;
            height: 200px;
            background: #ddd;
            overflow: hidden;
            position: relative;
        }
        .banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Products Section */
        .section-title {
            padding: 15px 20px 5px;
            font-size: 18px;
            color: var(--primary-green);
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 15px;
        }
        .product-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: relative;
        }
        .product-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }
        .product-info {
            padding: 10px;
        }
        .product-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #444;
        }
        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--accent-pink);
            color: white;
            padding: 3px 8px;
            font-size: 11px;
            border-radius: 4px;
        }

        /* Ad Container */
        .ad-box {
            margin: 20px 15px;
            background: #fff;
            border: 2px dashed var(--accent-pink);
            padding: 15px;
            text-align: center;
            color: #777;
            border-radius: 8px;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
            z-index: 1000;
        }
        .nav-item {
            text-align: center;
            font-size: 12px;
            color: #666;
            cursor: pointer;
            text-decoration: none;
        }
        .nav-item.active {
            color: var(--accent-pink);
            font-weight: bold;
        }

        /* Hidden Admin Panel Modal */
        #adminModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .admin-content {
            background: white;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            border-radius: 8px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .admin-content input, .admin-content textarea {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .admin-content button {
            background: var(--primary-green);
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        .close-btn {
            background: var(--accent-pink) !important;
            margin-top: 5px !important;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo-area" id="siteLogo">🌿 Natural Care</div>
        <div class="menu-icon" id="menuBtn">☰</div>
    </header>

    <!-- Banner -->
    <div class="banner">
        <img id="bannerImg" src="https://via.placeholder.com/600x200/2e7d32/ffffff?text=Natural+Care+Banner" alt="Banner">
    </div>

    <!-- Advertisement Section -->
    <div class="ad-box" id="adContainer">
        <!-- এখানে গুগল অ্যাডসেন্স বা যেকোনো অ্যাড নেটওয়ার্ক কোড পেস্ট করতে পারবেন -->
        <p>বিজ্ঞাপনের স্থান (Ad Space)</p>
    </div>

    <!-- Products -->
    <div class="section-title">Health Care Products</div>
    <div class="product-grid" id="productGrid">
        <!-- ডাইনামিক প্রোডাক্ট লিস্ট এখানে রেন্ডার হবে -->
    </div>

    <!-- Bottom Navigation (এখানে শেষ অপশনে ১০ বার ক্লিক করলে অ্যাডমিন প্যানেল খুলবে) -->
    <div class="bottom-nav">
        <div class="nav-item">🏠 হোম</div>
        <div class="nav-item">🛒 পণ্য</div>
        <div class="nav-item">📞 যোগাযোগ</div>
        <div class="nav-item" id="secretTrigger" style="color: var(--accent-pink);">⚙️ মেনু (১০ ক্লিক)</div>
    </div>

    <!-- Admin Panel Modal -->
    <div id="adminModal">
        <div class="admin-content">
            <h3>এডমিন প্যানেল</h3>
            <div id="loginSection">
                <p style="font-size: 12px; color: #666; margin-bottom: 5px;">ডিফল্ট ইমেইল: admin@gmail.com ও পাসওয়ার্ড: 12345</p>
                <input type="email" id="adminEmail" placeholder="ইমেইল দিন">
                <input type="password" id="adminPass" placeholder="পাসওয়ার্ড দিন">
                <button onclick="loginAdmin()">লগইন করুন</button>
            </div>
            
            <div id="dashboardSection" style="display:none;">
                <h4 style="margin: 10px 0; color: var(--primary-green);">ওয়েবসাইট এডিটর</h4>
                <label>হেডিং বা টাইটেল পরিবর্তন:</label>
                <input type="text" id="editTitleText" value="Health Care Products">
                
                <label>ব্যানার ছবি আপলোড (গ্যালারি থেকে):</label>
                <input type="file" id="uploadBannerFile" accept="image/*">
                
                <label>নতুন প্রোডাক্টের নাম:</label>
                <input type="text" id="newProdName" placeholder="প্রোডাক্টের নাম">
                
                <label>প্রোডাক্টের ছবি:</label>
                <input type="file" id="newProdImage" accept="image/*">
                
                <button onclick="saveChanges()">পরিবর্তন সংরক্ষণ করুন</button>
                <button onclick="logoutAdmin()" style="background:#555;">লগআউট</button>
            </div>
            <button class="close-btn" onclick="closeAdmin()">বন্ধ করুন</button>
        </div>
    </div>

    <script>
        // সিক্রেট ক্লিক কাউন্টার (নিচের অপশনে ১০ বার ক্লিক)
        let clickCount = 0;
        const secretTrigger = document.getElementById('secretTrigger');
        const adminModal = document.getElementById('adminModal');

        secretTrigger.addEventListener('click', () => {
            clickCount++;
            if (clickCount >= 10) {
                adminModal.style.display = 'flex';
                clickCount = 0; // রিসেট
            }
        });

        function closeAdmin() {
            adminModal.style.display = 'none';
        }

        // ডিফল্ট প্রোডাক্ট ডেটা
        let products = JSON.parse(localStorage.getItem('site_products')) || [
            { name: "গুড বডি হালুয়া - প্রাকৃতিক সমাধান", image: "https://via.placeholder.com/300x200/2e7d32/ffffff?text=Body+Halua", badge: "47% OFF" },
            { name: "জাইফা বেবি ফুড - পুষ্টিকর খাবার", image: "https://via.placeholder.com/300x200/d81b60/ffffff?text=Baby+Food", badge: "14% OFF" }
        ];

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            products.forEach((p, index) => {
                grid.innerHTML += `
                    <div class="product-card">
                        <span class="badge">${p.badge}</span>
                        <img src="${p.image}" alt="Product">
                        <div class="product-info">
                            <div class="product-title">${p.name}</div>
                            <button onclick="deleteProduct(${index})" style="background:#d81b60; color:white; border:none; padding:4px 8px; border-radius:3px; font-size:10px; cursor:pointer; margin-top:5px;">ডিলিট</button>
                        </div>
                    </div>
                `;
            });
        }
        renderProducts();

        // এডমিন লগইন লজিক
        function loginAdmin() {
            const email = document.getElementById('adminEmail').value;
            const pass = document.getElementById('adminPass').value;
            
            // আপনি আপনার ইচ্ছামত ইমেইল ও পাসওয়ার্ড এখানে সেট করতে পারেন
            if(email === "admin@gmail.com" && pass === "12345") {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
                alert('সফলভাবে লগইন হয়েছে!');
            } else {
                alert('ভুল ইমেইল বা পাসওয়ার্ড!');
            }
        }

        function logoutAdmin() {
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('dashboardSection').style.display = 'none';
        }

        // পরিবর্তন সেভ করা এবং ছবি আপলোড হ্যান্ডেল করা
        function saveChanges() {
            const newTitle = document.getElementById('editTitleText').value;
            document.querySelector('.section-title').innerText = newTitle;

            const bannerInput = document.getElementById('uploadBannerFile');
            if(bannerInput.files && bannerInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('bannerImg').src = e.target.result;
                    localStorage.setItem('site_banner', e.target.result);
                }
                reader.readAsDataURL(bannerInput.files[0]);
            }

            const prodName = document.getElementById('newProdName').value;
            const prodImageInput = document.getElementById('newProdImage');

            if(prodName && prodImageInput.files && prodImageInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    products.push({
                        name: prodName,
                        image: e.target.result,
                        badge: "NEW"
                    });
                    localStorage.setItem('site_products', JSON.stringify(products));
                    renderProducts();
                    alert('নতুন প্রোডাক্ট সফলভাবে যুক্ত হয়েছে!');
                }
                reader.readAsDataURL(prodImageInput.files[0]);
            } else {
                alert('তথ্য আপডেট করা হয়েছে!');
            }
            closeAdmin();
        }

        function deleteProduct(index) {
            if(confirm('আপনি কি এই প্রোডাক্টটি ডিলিট করতে চান?')) {
                products.splice(index, 1);
                localStorage.setItem('site_products', JSON.stringify(products));
                renderProducts();
            }
        }

        // লোকাল স্টোরেজ থেকে আগের সেভ করা ব্যানার লোড করা
        window.onload = function() {
            const savedBanner = localStorage.getItem('site_banner');
            if(savedBanner) {
                document.getElementById('bannerImg').src = savedBanner;
            }
        }
    </script>
</body>
</html>
